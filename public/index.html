<!doctype html>
<!--
  The text comes from strings.js: app.js fills in every data-text (and
  data-text-placeholder / data-text-aria-label) from the guest's language.
  Until the settings load, it uses the language in lang below.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="pageTitle"></title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/fonts/barlow-condensed-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="booth" data-state="loading">
    <video class="preview" id="preview" autoplay muted playsinline data-text-aria-label="previewLabel"></video>
    <canvas class="preview" id="freeze-frame" hidden aria-hidden="true"></canvas>
    <div class="shade shade-top" aria-hidden="true"></div>
    <div class="shade shade-bottom" aria-hidden="true"></div>

    <p class="bug"><span class="rec" id="rec-badge" hidden><span class="rec-dot" aria-hidden="true"></span>Rec<span class="bug-divider" aria-hidden="true"></span></span><span id="show-title"></span></p>

    <!-- The name tag stays on screen from the countdown to the last question. -->
    <div class="lower-third" id="lower-third" aria-hidden="true">
      <p class="lower-name" id="lower-name"></p>
      <p class="lower-tagline" id="lower-tagline"></p>
    </div>

    <section class="screen" id="screen-loading">
      <div class="strip">
        <p class="label" data-text="loadingLabel"></p>
        <p class="strip-text" data-text="loadingText"></p>
      </div>
    </section>

    <section class="screen" id="screen-start" hidden>
      <div class="strip">
        <h1 class="title" data-text="startTitle"></h1>
        <p class="note" id="start-note"></p>
      </div>
      <form id="start-form" autocomplete="off">
        <div class="lower-third is-form">
          <p class="label" aria-hidden="true" data-text="formLabel"></p>
          <input class="lower-name" id="name" name="name" maxlength="80" required data-text-placeholder="namePlaceholder" data-text-aria-label="nameLabel" enterkeyhint="next" spellcheck="false">
          <input class="lower-tagline" id="tagline" name="tagline" maxlength="80" data-text-aria-label="taglineLabel" enterkeyhint="go" spellcheck="false">
        </div>
        <button type="submit" class="pill" id="start-button"><span data-text="startButton"></span> <kbd data-text="keyEnter"></kbd></button>
      </form>
      <!-- One button per language in config.json, added by app.js. Hidden when there's only one. -->
      <div class="language-switch" id="language-switch" role="group" hidden></div>
    </section>

    <section class="screen" id="screen-countdown" hidden>
      <div class="strip">
        <p class="label" data-text="countdownLabel"></p>
        <p class="strip-text" data-text="countdownText"></p>
      </div>
      <p class="numeral" id="countdown-number" aria-live="assertive"></p>
    </section>

    <section class="screen" id="screen-question" hidden>
      <div class="strip">
        <p class="label" id="question-progress"></p>
        <h2 class="strip-text" id="question-text" aria-live="polite"></h2>
      </div>
      <div class="actions">
        <span class="timer-label" id="timer-label"></span>
        <button type="button" class="pill" id="next-button"><span id="next-label"></span> <kbd data-text="keySpace"></kbd></button>
      </div>
      <div class="timer-track" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div>
    </section>

    <section class="screen" id="screen-thanks" hidden>
      <div class="wrap">
        <h1 class="wrap-title" id="thanks-title"></h1>
        <p class="wrap-note" id="thanks-note"></p>
      </div>
    </section>

    <section class="screen" id="screen-error" hidden>
      <div class="strip">
        <p class="label" data-text="errorLabel"></p>
        <p class="strip-text" id="error-message"></p>
      </div>
      <div class="actions">
        <a class="pill" href="/settings"><span data-text="settings"></span> <kbd>Ctrl+,</kbd></a>
        <button type="button" class="pill" id="retry-button" data-text="retry"></button>
      </div>
    </section>
  </main>
</body>
</html>
