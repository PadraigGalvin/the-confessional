<!doctype html>
<!--
  Graphics for the compilation film, drawn with the booth's own stylesheet so they
  match what guests saw. scripts/compile.js loads this page in headless Chrome,
  calls render(spec) for each graphic and screenshots it. Overlays (the bug and the
  name tag) are drawn on a transparent background and laid over the video.
  To see a graphic, open this file in Chrome and run render({...}) in the console.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compilation graphics</title>
  <link rel="stylesheet" href="../../public/style.css">
  <style>
    html, body { background: transparent; }

    /* The recording isn't mirrored, so stills of it aren't either. */
    .preview { transform: none; }

    /* Over bright footage the bug needs a shadow to stay readable. */
    .bug { text-shadow: 0 0 calc(0.6 * var(--u)) rgb(0 0 0 / 0.7); }

    .layer { position: absolute; inset: 0; }

    /* Titles are passed in as text, so a "\n" in one starts a new line. */
    .intro-title, .wrap-title { white-space: pre-line; }

    /* --- Question card: a blurred still of the next answer, with the question over it --- */

    .card-still {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      object-fit: cover;
      filter: blur(calc(1.4 * var(--u))) brightness(0.5) saturate(0.85);
    }
    .card-still-fallback,
    .mosaic-fallback {
      background:
        radial-gradient(circle at 85% 20%, rgb(255 47 125 / 0.35), transparent 45%),
        linear-gradient(135deg, #241a26, var(--ink) 60%);
    }
    .card-shade { background: linear-gradient(90deg, rgb(8 6 12 / 0.75), rgb(8 6 12 / 0.15) 80%); }
    .card {
      position: absolute;
      left: calc(5 * var(--u));
      top: 50%;
      translate: 0 -50%;
      width: calc(80 * var(--u));
      display: grid;
      justify-items: start;
      gap: calc(1.6 * var(--u));
    }
    .card-question {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 0.95;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 calc(0.2 * var(--u)) calc(1 * var(--u)) rgb(0 0 0 / 0.5);
    }

    /* Highlighted words, like the guest's name on the booth's wrap screen. */
    .card-question mark,
    .intro-title mark {
      padding: 0 calc(1 * var(--u));
      background: var(--pink);
      color: var(--paper);
      text-shadow: none;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* --- Intro and credits: a wall of guests' faces behind the title --- */

    .mosaic {
      display: grid;
      background: var(--ink);
    }
    .mosaic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      min-height: 0;
      filter: grayscale(0.55) brightness(0.5) contrast(1.05);
    }
    .mosaic-shade {
      background:
        linear-gradient(90deg, rgb(8 6 12 / 0.8), rgb(8 6 12 / 0.25) 75%),
        linear-gradient(transparent 50%, rgb(8 6 12 / 0.5));
    }
    .is-credits .mosaic-shade { background: rgb(8 6 12 / 0.72); }
    .framed { box-shadow: inset 0 0 0 calc(0.5 * var(--u)) rgb(255 255 255 / 0.85); }

    .intro {
      position: absolute;
      left: calc(5 * var(--u));
      bottom: calc(9 * var(--u));
      display: grid;
      justify-items: start;
      gap: calc(1.4 * var(--u));
      width: calc(88 * var(--u));
    }
    .intro-title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .credits {
      position: absolute;
      left: calc(5 * var(--u));
      right: calc(5 * var(--u));
      top: calc(6 * var(--u));
      bottom: calc(6 * var(--u));
      display: flex;
      flex-direction: column;
      gap: calc(2 * var(--u));
    }
    .credits-names {
      margin: 0;
      padding: 0;
      list-style: none;
      column-gap: calc(4 * var(--u));
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.15;
      text-transform: uppercase;
    }
    .credits-names li { break-inside: avoid; }
  </style>
</head>
<body>
  <main class="booth" id="booth">
    <div class="layer" id="mosaic-layer" hidden>
      <div class="layer mosaic" id="mosaic"></div>
      <div class="layer mosaic-shade"></div>
    </div>
    <div class="layer" id="card-layer" hidden>
      <img class="card-still" id="card-still" alt="">
      <div class="layer card-shade"></div>
    </div>
    <img class="preview" id="freeze-frame" alt="" hidden>
    <div class="shade shade-bottom" id="shade-bottom" hidden></div>

    <p class="bug" id="bug" hidden><span id="show-title"></span></p>

    <div class="lower-third" id="lower-third">
      <p class="lower-name" id="lower-name"></p>
      <p class="lower-tagline" id="lower-tagline"></p>
    </div>

    <section class="screen" id="screen-card" hidden>
      <div class="card">
        <p class="label" id="card-label"></p>
        <h1 class="card-question" id="card-question"></h1>
      </div>
    </section>

    <section class="screen" id="screen-intro" hidden>
      <div class="intro">
        <p class="label" id="intro-label"></p>
        <h1 class="intro-title" id="intro-title"></h1>
        <p class="wrap-note" id="intro-note"></p>
      </div>
    </section>

    <section class="screen" id="screen-thanks" hidden>
      <div class="wrap">
        <h1 class="wrap-title" id="thanks-title"></h1>
        <p class="wrap-note" id="thanks-note"></p>
      </div>
    </section>

    <section class="screen" id="screen-credits" hidden>
      <div class="credits">
        <p class="label" id="credits-label"></p>
        <ul class="credits-names" id="credits-names"></ul>
      </div>
    </section>

    <div class="layer framed" id="frame" hidden></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const booth = $('booth');
    const LAYERS = ['mosaic-layer', 'card-layer', 'freeze-frame', 'shade-bottom', 'bug', 'frame',
      'screen-card', 'screen-intro', 'screen-thanks', 'screen-credits'];
    const FONTS = ['500 1em Barlow', '600 1em Barlow', '700 1em "Barlow Condensed"', '800 1em "Barlow Condensed"'];

    const unit = () => Math.max(innerWidth / 100, 6); // matches --u in style.css

    function showOnly(...ids) {
      for (const id of LAYERS) $(id).hidden = !ids.includes(id);
    }

    // Puts text in an element, wrapping each occurrence of `highlight` in a <mark>.
    function setText(element, text, highlight) {
      element.replaceChildren();
      const parts = highlight ? text.split(new RegExp(`(${highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i')) : [text];
      parts.forEach((part, i) => {
        if (!part) return;
        if (i % 2 === 1) {
          const mark = document.createElement('mark');
          mark.textContent = part;
          element.append(mark);
        } else {
          element.append(part);
        }
      });
    }

    // Shrinks an element's font until it fits, starting from `size` units.
    function fit(element, { size, min, maxWidth, maxHeight }) {
      let u = size;
      do {
        element.style.fontSize = `${u * unit()}px`;
        u -= 0.1;
      } while (u > min && (element.scrollWidth > maxWidth * unit() + 1 || element.offsetHeight > maxHeight * unit()));
    }

    function loadImage(img, src) {
      img.hidden = !src;
      if (!src) {
        img.removeAttribute('src');
        return null;
      }
      img.src = src;
      return img.decode();
    }

    // Fills the grid with stills, repeating them so there are no empty cells.
    function fillMosaic(stills) {
      const mosaic = $('mosaic');
      mosaic.classList.toggle('mosaic-fallback', stills.length === 0);
      const columns = Math.max(1, Math.ceil(Math.sqrt(stills.length)));
      const rows = Math.max(1, Math.ceil(stills.length / columns));
      mosaic.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
      mosaic.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      const images = [];
      for (let i = 0; stills.length && i < columns * rows; i++) {
        const img = document.createElement('img');
        img.alt = '';
        images.push(img);
      }
      mosaic.replaceChildren(...images);
      return images.map((img, i) => loadImage(img, stills[i % stills.length]));
    }

    const layouts = {
      // The show title in the top corner, for the whole of every answer.
      bug({ showTitle }) {
        showOnly('bug');
        $('show-title').textContent = showTitle;
      },

      // The name tag, exactly as it was in the booth.
      'lower-third'({ name, tagline }) {
        showOnly('shade-bottom');
        booth.dataset.state = 'question';
        $('lower-name').textContent = name;
        $('lower-tagline').textContent = tagline ?? '';
      },

      card({ label, question, highlight, still, showTitle }) {
        showOnly('card-layer', 'bug', 'screen-card');
        $('card-layer').classList.toggle('card-still-fallback', !still);
        $('show-title').textContent = showTitle;
        $('card-label').textContent = label;
        setText($('card-question'), question, highlight);
        fit($('card-question'), { size: 6.2, min: 3, maxWidth: 80, maxHeight: 40 });
        return [loadImage($('card-still'), still)];
      },

      // The intro is two layers so the title can slide in over the faces.
      'intro-background'({ stills }) {
        showOnly('mosaic-layer', 'frame');
        booth.classList.remove('is-credits');
        return fillMosaic(stills);
      },
      'intro-title'({ label, title, highlight, note }) {
        showOnly('screen-intro');
        $('intro-label').textContent = label;
        setText($('intro-title'), title, highlight);
        $('intro-note').textContent = note ?? '';
        fit($('intro-title'), { size: 11, min: 4, maxWidth: 88, maxHeight: 34 });
      },

      // The booth's "That's a wrap" screen, over a freeze frame of the last answer.
      wrap({ title, highlight, note, still }) {
        showOnly('freeze-frame', 'shade-bottom', 'screen-thanks');
        booth.dataset.state = 'thanks';
        setText($('thanks-title'), title, highlight);
        $('thanks-note').textContent = note ?? '';
        return [loadImage($('freeze-frame'), still)];
      },

      credits({ label, names, stills }) {
        showOnly('mosaic-layer', 'frame', 'screen-credits');
        booth.classList.add('is-credits');
        $('credits-label').textContent = label;
        const list = $('credits-names');
        list.replaceChildren(...names.map((name) => {
          const item = document.createElement('li');
          item.textContent = name;
          return item;
        }));
        list.style.columnCount = names.length <= 6 ? 1 : names.length <= 16 ? 2 : names.length <= 33 ? 3 : 4;
        fit(list, { size: 5, min: 1.4, maxWidth: 90, maxHeight: 40 });
        return fillMosaic(stills);
      },
    };

    window.render = async (spec) => {
      const layout = layouts[spec.type];
      if (!layout) throw new Error(`Unknown graphic type: ${spec.type}`);
      await Promise.all(FONTS.map((font) => document.fonts.load(font)));
      delete booth.dataset.state;
      const loading = layout(spec) ?? [];
      await Promise.all(loading);
      await document.fonts.ready;
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    };
  </script>
</body>
</html>
